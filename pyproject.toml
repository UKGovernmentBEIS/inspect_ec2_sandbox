[project]
name = "inspect-ec2-sandbox"
version = "0.1.1"
description = "An EC2 Sandbox Environment for Inspect"
dynamic = ["readme"]
license = "MIT"
authors = [
    {name = "UK AI Security Institute"}
]
requires-python = ">=3.10"
dependencies = [
    "tenacity>=9.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pydantic-extra-types>=2.10.2",
    "inspect_ai>=0.3.79",
    "rich>=13.9",
    "platformdirs>=4.3.7",
    "boto3>=1.35.0",
    "websocket-client>=1.8.0",
    "pydantic-settings>=2.14.2",
]

[project.urls]
Repository = "https://github.com/UKGovernmentBEIS/inspect_ec2_sandbox"
Changelog = "https://github.com/UKGovernmentBEIS/inspect_ec2_sandbox/blob/main/CHANGELOG.md"

[project.entry-points."inspect_ai"]
"ec2-sandbox" = "ec2sandbox._ec2_sandbox_environment"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["tests"]
testpaths = ["tests/**/*.py"]
addopts = ["--strict-markers"]
markers = [
    "req_aws: marks tests as requiring real AWS access (deselect with '-m \"not req_aws\"')",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# The PyPI page renders README.md without a base URL, so repo-relative links 404
# there. Rewrite them to GitHub URLs at build time only, keeping the links in the
# repo relative (working in editors and independent of the git host).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/UKGovernmentBEIS/inspect_ec2_sandbox/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/ec2sandbox"]

# Keep infra/ (contains environment-specific CDK context), tests/ and uv.lock
# out of the published sdist
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # flake8
  "D",   # pydocstyle
  "I",   # isort
]
ignore = [
  "D212",  # multi-line-summary-first-line
]

[tool.ruff.lint.per-file-ignores]
# Rationale: public objects in the tests and experimental dirs don't form part of the 
# package so drop the requirement for docstrings.
"tests/*" = ["D10"]  # undocumented-(public|magic)-*
"src/ec2sandbox/experimental/*" = ["D10"]  # undocumented-(public|magic)-*

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
plugins = "pydantic.mypy"
packages = ["ec2sandbox", "tests.ec2sandboxtest"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# TEMPORARY: pins the dev environment to inspect_ai main for the portable sandbox
# self-check suite, which is not yet in a PyPI release. Sources are stripped from
# published metadata, so consumers of the wheel/sdist are unaffected. Remove this
# and raise the `inspect_ai` floor once inspect publishes a release containing it.
[tool.uv.sources]
inspect-ai = { git = "https://github.com/UKGovernmentBEIS/inspect_ai", rev = "9fa31ccbccd0157bab73b1caa8b03c522470f83d" }

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.3",
]
